name: hospital-spark

services:
  # ---------- HDFS（大数据存储层：ODS/DWD/DWS 分层数据以 Parquet 落 HDFS） ----------
  namenode:
    build: ./docker/hadoop
    image: hospital-hdfs:3.3.6
    container_name: hdfs-namenode
    hostname: namenode
    environment:
      - HDFS_ROLE=namenode
    ports:
      - "9870:9870"   # NameNode Web UI
      - "8020:8020"   # NameNode RPC（Spark/HDFS 客户端接入）
    volumes:
      - hdfs-namenode:/data/dfs/name
      - ./data:/opt/workspace/data:ro   # 供 etl/upload_to_hdfs.py 上传治理后 CSV
    restart: unless-stopped

  datanode:
    build: ./docker/hadoop
    image: hospital-hdfs:3.3.6
    container_name: hdfs-datanode
    hostname: datanode
    environment:
      - HDFS_ROLE=datanode
    ports:
      - "9864:9864"   # DataNode Web UI
    volumes:
      - hdfs-datanode:/data/dfs/data
    depends_on:
      - namenode
    restart: unless-stopped

  # ---------- Spark Standalone 集群（Mac M1 原生 arm64） ----------
  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master
    command: /opt/spark/sbin/start-master.sh
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - HADOOP_USER_NAME=root   # HDFS 客户端以超级用户身份访问（Spark 镜像默认 uid 185）
    ports:
      - "8080:8080"   # Master Web UI
      - "7077:7077"   # 提交作业端口
    volumes:
      - ./data:/opt/workspace/data:ro
      - ./spark:/opt/workspace/jobs
      # HDFS 客户端配置：/opt/spark/conf 在 Spark 默认 classpath 上
      - ./docker/hadoop/conf/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./docker/hadoop/conf/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro
    depends_on:
      - namenode
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.3
    container_name: spark-worker
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_WEBUI_PORT=8081
      - HADOOP_USER_NAME=root   # HDFS 客户端以超级用户身份访问
    depends_on:
      - spark-master
      - namenode
    volumes:
      - ./data:/opt/workspace/data:ro
      - ./spark:/opt/workspace/jobs
      - ./docker/hadoop/conf/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./docker/hadoop/conf/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro
    ports:
      - "8081:8081"   # Worker Web UI
    restart: unless-stopped

  # ---------- MySQL（ADS 层结果存储，供 Flask 查询） ----------
  mysql:
    image: mysql:8.0
    container_name: hospital-mysql
    environment:
      MYSQL_ROOT_PASSWORD: hospital123
      MYSQL_DATABASE: hospital
      MYSQL_USER: app
      MYSQL_PASSWORD: app123
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"   # 宿主机 3306 被本地 MySQL 占用，改用 3307
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql-data:
  hdfs-namenode:
  hdfs-datanode:
